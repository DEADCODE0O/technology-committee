  <!-- Eyes -->
  <circle cx="69" cy="71" r="2.8" fill="#0f172a" />
  <circle cx="91" cy="71" r="2.8" fill="#0f172a" />
  <circle cx="70" cy="70" r="1" fill="#ffffff" />
