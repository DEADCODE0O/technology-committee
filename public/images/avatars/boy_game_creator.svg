  <rect x="42" y="66" width="10" height="20" rx="4" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" />
  <rect x="108" y="66" width="10" height="20" rx="4" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" />
  <!-- Headset Mic -->
  <path d="M48 84c4 10 18 12 26 10" stroke="#fb7185" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="76" cy="94" r="2.5" fill="#38bdf8" />
  <!-- Eyes -->
  <ellipse cx="70" cy="72" rx="3.5" ry="4.5" fill="#09090b" />
  <ellipse cx="90" cy="72" rx="3.5" ry="4.5" fill="#09090b" />
  <circle cx="71.5" cy="70.5" r="1.2" fill="#ffffff" />
  <circle cx="91.5" cy="70.5" r="1.2" fill="#ffffff" />
