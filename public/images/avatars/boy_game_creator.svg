  <ellipse cx="80" cy="72" rx="27" ry="30" fill="url(#skin5)" />
  <!-- Modern Anime-style hair -->
  <path d="M50 62c0-18 12-30 30-30 18 0 28 10 28 26-4-6-12-8-18-6-4 1-8 5-14 3-8-2-16-1-26 7z" fill="#27272a" />
