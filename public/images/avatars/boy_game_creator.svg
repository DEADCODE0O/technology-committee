<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="skin5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#bg5)" stroke="#fb7185" stroke-width="2.5" />
  <!-- Gamepad Pixel Motifs in BG -->
  <rect x="30" y="45" width="6" height="6" fill="#fb7185" opacity="0.4" />
  <rect x="36" y="51" width="6" height="6" fill="#fb7185" opacity="0.4" />
  <rect x="124" y="45" width="6" height="6" fill="#fb7185" opacity="0.4" />
  <rect x="118" y="51" width="6" height="6" fill="#fb7185" opacity="0.4" />
  <!-- Body / Gamer Hoodie -->
  <path d="M28 148c0-30 22-42 52-42s52 12 52 42z" fill="#09090b" />
  <path d="M52 114l28 20 28-20z" fill="#e11d48" opacity="0.8" />
